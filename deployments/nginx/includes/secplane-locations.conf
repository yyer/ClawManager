# secplane-server locations — included by ClawManager nginx.conf inside
# its `server { listen 8443 ssl; ... }` block. Owned by the secplane-server
# module; the only file in ClawManager that references these is the main
# nginx.conf which uses `include` to pull this in. Edit here when the
# reverse-proxy rules for /api/v1/secplane/* or /secplane/* change —
# never duplicate the blocks into nginx.conf.
#
# Two locations, ordered so that the longer /api prefix wins over /secplane
# (nginx matches the most specific location prefix first; the `^~` modifier
# forces a prefix match without further regex testing).

# /api/v1/secplane/* → secplane-server:9100 — JSON API for the SPA
location ^~ /api/v1/secplane/ {
    # Runtime-resolved upstream (see secplane-upstream.conf): nginx must
    # start even when the secplane-server Service does not exist yet.
    # ${SECPLANE_SERVER_HOST}/${SECPLANE_SERVER_PORT} are rendered by
    # start.sh's envsubst pass before nginx parses this file.
    set $secplane_upstream ${SECPLANE_SERVER_HOST}:${SECPLANE_SERVER_PORT};
    proxy_pass http://$secplane_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Allow large zip uploads (ClawAegis skill archives can be tens of MB)
    client_max_body_size 100m;
    proxy_connect_timeout 15s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# /secplane/* → secplane-server:9100 — embedded React SPA. The bundle is
# built with `<base href="/secplane/">` (see secplane-server/frontend
# /vite.config.ts) and HTML5 history mode, so any /secplane/<path> needs
# to land on secplane-server, which serves the static bundle and falls
# back to /index.html for unknown routes.
location ^~ /secplane/ {
    # Runtime-resolved upstream (see secplane-upstream.conf for why this
    # is a variable and not a static `upstream {}` block).
    set $secplane_upstream ${SECPLANE_SERVER_HOST}:${SECPLANE_SERVER_PORT};
    proxy_pass http://$secplane_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # The SPA bundle is ~3-5 MB; allow it to flow through
    # without buffering. Asset chunks are content-hashed so
    # long cache lifetimes are safe.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 15s;
    proxy_read_timeout 60s;
}

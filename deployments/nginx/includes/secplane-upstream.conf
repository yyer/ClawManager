# secplane-server upstream — included by ClawManager nginx.conf inside
# its `http {}` block. Owned by the secplane-server module; the only
# file in ClawManager that references it is the main nginx.conf which
# uses `include` to pull this in. Edit here when the upstream address
# or keepalive changes — never duplicate the block into nginx.conf.
#
# This file is rendered by start.sh via envsubst (envsubst does NOT
# recurse into `include` directives, so the placeholder here is left
# unrendered in the source tree and only resolved at container start).
upstream secplane_server_upstream {
    server ${SECPLANE_SERVER_HOST}:${SECPLANE_SERVER_PORT};
    keepalive 32;
}

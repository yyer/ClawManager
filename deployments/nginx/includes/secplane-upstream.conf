# secplane-server upstream — included by ClawManager nginx.conf inside
# its `http {}` block. Owned by the secplane-server module; the only
# file in ClawManager that references it is the main nginx.conf which
# uses `include` to pull this in.
#
# DELIBERATELY NO `upstream {}` BLOCK: nginx resolves the `server`
# hostnames of a static upstream at CONFIG LOAD time, and aborts
# startup with `[emerg] host not found in upstream` when the
# secplane-server Service does not exist yet. That would take down the
# whole ClawManager gateway — not just the /secplane/ routes.
#
# Instead, secplane-locations.conf assigns the rendered
# ${SECPLANE_SERVER_HOST}:${SECPLANE_SERVER_PORT} to an nginx variable
# and uses `proxy_pass http://$variable`, which nginx resolves per
# request via the `resolver` directive already templated by start.sh
# (the same runtime-resolution pattern the desktop per-instance
# Service FQDNs use). With no secplane-server deployed, nginx still
# starts and only /secplane/ + /api/v1/secplane/ requests return 502.
#
# Trade-off: variable proxy_pass does not reuse the upstream
# keepalive pool. Secplane is a low-traffic admin plane, so this is
# acceptable.
#
# This file is rendered by start.sh via envsubst (envsubst does NOT
# recurse into `include` directives, so placeholders in include files
# are left unrendered in the source tree and only resolved at
# container start).
